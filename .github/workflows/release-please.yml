# Create Python release PRs and publish merged releases.
name: Release PR 🐍

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch: {}

jobs:
  release-please:
    name: Create Python release PR or release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['impl/py--release_created'] }}
      release_sha: ${{ steps.release.outputs['impl/py--sha'] }}
      tag_name: ${{ steps.release.outputs['impl/py--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          target-branch: ${{ github.ref_name }}

  # Publish the package to PyPI using Trusted Publishing.
  #
  # Register `release-please.yml` as a PyPI trusted publisher (environment:
  # pypi) to use this.
  #
  # This code is a clone of the `python-release.yml`. PyPI
  # Trusted Publishing does not support reusing workflows through
  # `workflow_call`, so these cannot be deduplicated.
  #
  # Ensure this definition and `python-release.yml` remain in sync.
  publish:
    name: Publish Python package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # Trusted Publishing must run directly in the registered workflow.
    runs-on: ubuntu-latest
    environment: pypi
    env:
      UV_VERSION: "0.8.12"
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^jeff-format-py-v[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+|rc[0-9]+)?$ ]]; then
            echo "Expected a jeff-format-py-v* release tag, got: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PACKAGE_VERSION=$(sed -n '/^\[project\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' impl/py/pyproject.toml)
          if [[ "jeff-format-py-v$PACKAGE_VERSION" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Verify draft GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$RELEASE_TAG"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build wheel and source distribution
        run: uv build impl/py --out-dir dist

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Attach distributions and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
